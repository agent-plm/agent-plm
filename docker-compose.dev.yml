services:
  api:
    build:
      context: .
      dockerfile: apps/api/quarkus/Dockerfile.dev
    image: agent-plm-api-dev
    volumes:
      - .:/repo
      - api-m2-cache:/m2/repository
    environment:
      QUARKUS_PROFILE: dev
      MAVEN_OPTS: -Dmaven.repo.local=/m2/repository
      PLM_OTEL_SDK_DISABLED: "true"
      QUARKUS_OBSERVABILITY_ENABLED: "false"

  web:
    build:
      context: .
      dockerfile: apps/web/nextjs/Dockerfile.dev
    image: agent-plm-web-dev
    volumes:
      - .:/repo
      - web-root-node-modules:/repo/node_modules
      - web-app-node-modules:/repo/apps/web/nextjs/node_modules
      - web-pnpm-store:/pnpm
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
      PNPM_HOME: /pnpm
      HOME: /pnpm/home
      XDG_CACHE_HOME: /pnpm/cache

volumes:
  api-m2-cache:
  web-root-node-modules:
  web-app-node-modules:
  web-pnpm-store:

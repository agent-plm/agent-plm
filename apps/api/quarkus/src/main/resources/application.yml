quarkus:
  application:
    name: plm-api
  http:
    port: 8080
    cors:
      enabled: true
      origins: ${PLM_CORS_ORIGINS:https://agent-plm.local,http://localhost:3000}
      headers: accept,authorization,content-type,x-requested-with,x-request-id,x-correlation-id
      methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    auth:
      permission:
        public:
          paths: /api/health,/api/info,/q/health,/q/health/*
          policy: permit
        authenticated:
          paths: /api/*
          policy: authenticated
  oidc:
    enabled: true
    application-type: service
    auth-server-url: ${PLM_OIDC_AUTH_SERVER_URL:https://agent-plm.local/authelia}
    token:
      issuer: ${PLM_OIDC_ISSUER:https://agent-plm.local/authelia}
    client-id: plm-api
    credentials:
      secret: ${PLM_OIDC_CLIENT_SECRET:local-dev-plm-api-secret}
    tls:
      verification: none
  datasource:
    db-kind: postgresql
    username: ${PLM_DB_USER:plm}
    password: ${PLM_DB_PASSWORD:plm}
    jdbc:
      url: ${PLM_DB_URL:jdbc:postgresql://localhost:5432/plm}
  hibernate-orm:
    enabled: true
    schema-management:
      strategy: none
    mapping:
      format:
        global: ignore
    unsupported-properties:
      "hibernate.temporal.table_strategy": HISTORY_TABLE
      "hibernate.temporal.changeset_id_supplier": io.agentplm.api.persistence.PlmChangesetSupplier
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
  otel:
    sdk:
      disabled: ${PLM_OTEL_SDK_DISABLED:true}
  log:
    level: INFO
  jackson:
    write-dates-as-timestamps: false

"%dev":
  quarkus:
    http:
      host: 0.0.0.0
    datasource:
      devservices:
        enabled: false
    flyway:
      migrate-at-start: true
    observability:
      enabled: false
    oidc:
      tls:
        verification: none
    otel:
      sdk:
        disabled: true

"%test":
  quarkus:
    datasource:
      devservices:
        enabled: false
    flyway:
      migrate-at-start: false
    hibernate-orm:
      enabled: false
    oidc:
      enabled: false
    http:
      auth:
        permission:
          authenticated:
            paths: /*
            policy: permit

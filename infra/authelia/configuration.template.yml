---
theme: auto
server:
  address: tcp://0.0.0.0:9091/authelia
log:
  level: info
identity_validation:
  reset_password:
    jwt_secret: local-dev-only-change-me-jwt-secret
authentication_backend:
  file:
    path: /config/users_database.yml
access_control:
  default_policy: one_factor
  rules:
    - domain: agent-plm.local
      policy: one_factor
session:
  secret: local-dev-only-change-me-session-secret
  cookies:
    - name: authelia_session
      domain: agent-plm.local
      authelia_url: https://agent-plm.local/authelia
      default_redirection_url: https://agent-plm.local/
storage:
  encryption_key: local-dev-only-change-me-storage-key
  local:
    path: /config/runtime/db.sqlite3
notifier:
  filesystem:
    filename: /config/runtime/notification.txt
identity_providers:
  oidc:
    hmac_secret: local-dev-only-change-me-oidc-hmac-secret
    jwks:
      - key: |
@OIDC_PRIVATE_KEY@
        certificate_chain: |
@OIDC_CERTIFICATE@
    lifespans:
      access_token: 1h
      authorize_code: 1m
      id_token: 1h
      refresh_token: 90m
    enable_client_debug_messages: true
    clients:
      - client_id: plm-api
        client_name: PLM API
        client_secret: local-dev-plm-api-secret
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://oauth.pstmn.io/v1/callback
        scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        userinfo_signed_response_alg: none

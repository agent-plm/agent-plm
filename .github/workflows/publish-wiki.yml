name: Publish Wiki

on:
  # Publish after main-branch CI succeeds (independent workflow file from ci.yml).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Doc-only changes on main can publish without waiting for a separate CI trigger.
  push:
    branches: [main]
    paths:
      - "README.md"
      - "PLM_SPEC.md"
      - "docs/wiki/**"
      - "scripts/build-wiki.sh"
      - "infra/README.md"
      - "modules/README.md"
      - "kernel/README.md"
      - "migrations/README.md"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve source ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Build wiki pages
        run: bash scripts/build-wiki.sh wiki-out

      - name: Publish to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          rsync -av --delete wiki-out/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from agent-plm@${{ steps.ref.outputs.sha }}"
          git push
